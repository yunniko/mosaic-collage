# Serves the static export (D016). TLS and the public hostname are handled by the host's nginx vhost.

# Hashed build assets never change under the same name; everything else is revalidated.
map $uri $cache_control {
    ~^/_next/static/ "public, max-age=31536000, immutable";
    default          "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Set here once; a location adds no add_header of its own, so every response inherits these.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # pdf.js ships its worker as .mjs, which must be served as JavaScript to start.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}

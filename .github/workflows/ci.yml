name: CI

# A public repo, so GitHub's own runners cost nothing. The e2e suite runs against the production image itself: the
# static export behind the same nginx config (STANDARDS.md: verified means the path production runs).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10 (bundled with Node 22) crashes resolving this lockfile's peer set; it was written by npm 11.
      - run: npx -y npm@11 ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium firefox
      # The image builds the export from this checkout, so the suite can never run against a stale build.
      - run: docker build -t mosaic-collage .
      - run: docker run -d --name mosaic -p 127.0.0.1:4317:80 mosaic-collage
      - run: timeout 30 sh -c 'until curl -sf http://127.0.0.1:4317/ >/dev/null; do sleep 1; done'
      - run: npx playwright test
        env:
          CI: "1"
          E2E_EXTERNAL: "1"
      - run: docker logs mosaic
        if: failure()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
